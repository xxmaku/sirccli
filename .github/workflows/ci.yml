name: sIrcCli CI

on:
  pull_request:
    branches: [ "master" ]

jobs:
  # ----------------------------
  # Build and restore .NET solution
  # ----------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      build-artifact: ${{ steps.build.outputs.artifact-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Clean workspace
        run: dotnet clean

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        id: build
        run: |
          dotnet build --configuration Release --no-restore
          echo "artifact-path=$(pwd)" >> $GITHUB_OUTPUT

      - name: Run tests
        run: dotnet test --configuration Release --no-restore --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner || dotnet tool update --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Run SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          dotnet-sonarscanner begin /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION" /d:sonar.login="$SONAR_TOKEN"
          dotnet build --configuration Release
          dotnet-sonarscanner end /d:sonar.login="$SONAR_TOKEN"

  # SonarCloud integration was moved into the main build job above.
  # ----------------------------
  # SAST & SCA Scans (run in parallel)
  # ----------------------------
  security-scans:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scan: [semgrep, snyk, trivy-fs, sbom]
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      SEMGREP_PR_ID: ${{ github.event.pull_request.number || github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Semgrep
        if: matrix.scan == 'semgrep'
        uses: semgrep/semgrep-action@v1
        with:
          publishToken: $SEMGREP_APP_TOKEN
          args: "semgrep ci --json --output semgrep_report.json"

      - name: Setup .NET for Snyk
        if: matrix.scan == 'snyk'
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Install Snyk CLI
        if: matrix.scan == 'snyk'
        run: npm install -g snyk

      - name: Authenticate Snyk
        if: matrix.scan == 'snyk'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      - name: Run Snyk test (dotnet)
        if: matrix.scan == 'snyk'
        run: snyk test --org=xxmaku --all-projects --json > snyk_report.json || true

      - name: Run Snyk monitor (dotnet)
        if: matrix.scan == 'snyk'
        run: snyk monitor --org=xxmaku --all-projects || true
                  
      - name: Install CycloneDX .NET CLI
        if: matrix.scan == 'sbom'
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM
        if: matrix.scan == 'sbom'
        run: dotnet-CycloneDX sircceli.slnx -F json -fn sbom.json

      - name: Aqua Security Trivy (FS)
        if: matrix.scan == 'trivy-fs'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          format: json
          output: trivyfs.json
          cache: true
          cache-dir: ${{ github.workspace }}/.cache/trivy
          version: v0.69.3
          severity: HIGH,CRITICAL                
              
      - name: Upload scan artifact
        if: matrix.scan == 'semgrep' || matrix.scan == 'sbom' || matrix.scan == 'trivy-fs' || matrix.scan == 'snyk'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scan }}-artifact
          path: |
            semgrep_report.json
            sbom.json
            trivyfs.json
            snyk_report.json

  # ----------------------------
  # Docker build + container scan
  # ----------------------------
  docker:
    needs: security-scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t mkkuusinen/sircceli:latest -f sircceli/Dockerfile .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKER_USERNAME }}/sircceli:latest
          format: json
          output: trivyimage.json
          cache: true
          cache-dir: ${{ github.workspace }}/.cache/trivy
          version: v0.69.3
          severity: HIGH,CRITICAL

      - name: Upload container scan
        uses: actions/upload-artifact@v4
        with:
          name: trivyimage-artifact
          path: trivyimage.json


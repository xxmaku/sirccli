name: sIrcCli CD

on:
  push:
    branches: [ "master" ]

jobs:
  # ----------------------------
  # Build and restore .NET solution
  # ----------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      build-artifact: ${{ steps.build.outputs.artifact-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Clean workspace
        run: dotnet clean

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        id: build
        run: |
          dotnet build --configuration Release --no-restore
          echo "artifact-path=$(pwd)" >> $GITHUB_OUTPUT

  # ----------------------------
  # Desktop release artifacts
  # ----------------------------
  desktop-artifacts:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            artifact_name: sircceli-desktop-linux-x64.zip
          - os: windows-latest
            runtime: win-x64
            artifact_name: sircceli-desktop-win-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Publish and package desktop app
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          release_root="$GITHUB_WORKSPACE/artifacts/desktop-release/${{ matrix.runtime }}"
          publish_dir="$release_root/publish"
          zip_path="$release_root/${{ matrix.artifact_name }}"

          rm -rf "$release_root"
          mkdir -p "$publish_dir"

          dotnet publish sircceli.desktop/sircceli.desktop.csproj \
            -c Release \
            -r ${{ matrix.runtime }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o "$publish_dir"

          (cd "$publish_dir" && zip -r "$zip_path" .)

      - name: Publish and package desktop app
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\desktop-release\${{ matrix.runtime }}"
          $publishDir = Join-Path $releaseRoot 'publish'
          $zipPath = Join-Path $releaseRoot '${{ matrix.artifact_name }}'

          Remove-Item -Recurse -Force $releaseRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null

          dotnet publish sircceli.desktop/sircceli.desktop.csproj `
            -c Release `
            -r ${{ matrix.runtime }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o $publishDir

          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $zipPath -Force

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/desktop-release/${{ matrix.runtime }}/${{ matrix.artifact_name }}

  # ----------------------------
  # SonarCloud scan
  # ----------------------------
  sonarcloud:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner || dotnet tool update --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Run SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          dotnet-sonarscanner begin /k:"${{ secrets.SONAR_PROJECT_KEY }}" /o:"${{ secrets.SONAR_ORGANIZATION }}" /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
          dotnet build --configuration Release
          dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

  # ----------------------------
  # SAST & SCA Scans (run in parallel)
  # ----------------------------
  security-scans:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scan: [semgrep, snyk, trivy-fs, sbom]
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      SEMGREP_PR_ID: ${{ github.event.pull_request.number || github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Semgrep
        if: matrix.scan == 'semgrep'
        uses: semgrep/semgrep-action@v1
        with:
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          args: "semgrep ci --json --output semgrep_report.json"

      - name: Setup .NET for Snyk
        if: matrix.scan == 'snyk'
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Install Snyk CLI
        if: matrix.scan == 'snyk'
        run: npm install -g snyk

      - name: Authenticate Snyk
        if: matrix.scan == 'snyk'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      - name: Run Snyk test (dotnet)
        if: matrix.scan == 'snyk'
        run: snyk test --org=xxmaku --all-projects --json > snyk_report.json || true

      - name: Run Snyk monitor (dotnet)
        if: matrix.scan == 'snyk'
        run: snyk monitor --org=xxmaku --all-projects || true
                  
      - name: Install CycloneDX .NET CLI
        if: matrix.scan == 'sbom'
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM
        if: matrix.scan == 'sbom'
        run: dotnet-CycloneDX sircceli.slnx -F json -fn sbom.json

      - name: Aqua Security Trivy (FS)
        if: matrix.scan == 'trivy-fs'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          format: json
          output: trivyfs.json
          cache: true
          cache-dir: ${{ github.workspace }}/.cache/trivy
          version: v0.69.3
          severity: HIGH,CRITICAL                
              
      - name: Upload scan artifact
        if: matrix.scan == 'semgrep' || matrix.scan == 'sbom' || matrix.scan == 'trivy-fs' || matrix.scan == 'snyk'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scan }}-artifact
          path: |
            semgrep_report.json
            sbom.json
            trivyfs.json
            snyk_report.json

  # ----------------------------
  # Docker build + container scan
  # ----------------------------
  docker:
    needs: security-scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t mkkuusinen/sircceli:latest -f sircceli/Dockerfile .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKER_USERNAME }}/sircceli:latest
          format: json
          output: trivyimage.json
          cache: true
          cache-dir: ${{ github.workspace }}/.cache/trivy
          version: v0.69.3
          severity: HIGH,CRITICAL

      - name: Upload container scan
        uses: actions/upload-artifact@v4
        with:
          name: trivyimage-artifact
          path: trivyimage.json

      - name: Push Docker image
        run: docker push mkkuusinen/sircceli:latest   

